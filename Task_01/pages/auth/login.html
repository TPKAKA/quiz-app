<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - User Authentication</title>
  <meta name="description" content="Login to your account to access personalized features and content">
  <meta name="keywords" content="login, authentication, user account, sign in">
  <link rel="stylesheet" href="../../css/auth.css">
</head>
<body>
  <main>
    <div class="auth-bg"></div>
    
    <section class="login-section" aria-labelledby="login-title">
      <form class="auth-form" action="#" method="post" novalidate>
        <h2 id="login-title">Login</h2>
        
        <div class="form-group">
          <label for="username">Username</label>
          <input 
            type="text" 
            id="username" 
            name="username" 
            placeholder="Enter your username" 
            required 
            autocomplete="username"
          >
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="Enter your password" 
            required 
            autocomplete="current-password"
          >
        </div>
        
        <div class="form-actions">
          <a href="../../home.html" class="btn-home" role="button">Back to Home</a>
          <button type="submit" class="btn-submit">Login</button>
        </div>
        
        <div class="links">
          <a href="#" aria-label="Forgot your password?">Forgot password?</a><br>
          Don't have an account? <a href="register.html" aria-label="Create a new account">Register</a>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
