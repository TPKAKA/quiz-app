<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - User Authentication</title>
  <meta name="description" content="Login to your account to access personalized features and content">
  <meta name="keywords" content="login, authentication, user account, sign in">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 to-indigo-100 bg-cover bg-center bg-no-repeat" style="background-image: url('../../assets/back_ground.png');">
  <div class="absolute inset-0 "></div>
  <main class="w-full max-w-md relative z-10">
    <section class="bg-white rounded-lg shadow-lg p-8" aria-labelledby="login-title">
      <form action="#" method="post" novalidate>
        <h2 id="login-title" class="text-2xl font-bold text-center text-gray-800 mb-6">Login</h2>
        
        <div class="mb-4">
          <label for="username" class="block text-sm font-medium text-gray-700 mb-2">Username</label>
          <input 
            type="text" 
            id="username" 
            name="username" 
            placeholder="Enter your username" 
            required 
            autocomplete="username"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          >
        </div>
        
        <div class="mb-6">
          <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Password</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="Enter your password" 
            required 
            autocomplete="current-password"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          >
        </div>
        
        <div class="flex justify-between items-center mb-6">
          <a href="../../pages/home.html" class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded-md text-sm font-medium transition-colors duration-300 no-underline" role="button">Back to Home</a>
          <button type="submit" class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded-md text-sm font-medium transition-colors duration-300">Login</button>
        </div>
        
        <div class="text-center text-sm text-gray-600">
          <a href="#" class="text-blue-500 hover:text-blue-600 no-underline" aria-label="Forgot your password?">Forgot password?</a><br>
          <span class="mt-2 block">Don't have an account? <a href="register.html" class="text-blue-500 hover:text-blue-600 no-underline" aria-label="Create a new account">Register</a></span>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
