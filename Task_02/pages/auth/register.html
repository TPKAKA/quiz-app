<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Create New Account</title>
  <meta name="description" content="Create a new account to access personalized features and content">
  <meta name="keywords" content="register, sign up, create account, new user, registration">
  <link rel="stylesheet" href="../../css/auth.css">
</head>
<body>
  <main>
    <div class="auth-bg"></div>
    
    <section class="register-section" aria-labelledby="register-title">
      <form class="auth-form" action="#" method="post" novalidate>
        <h2 id="register-title">Register</h2>
        
        <div class="form-row">
          <div class="form-group">
            <label for="firstName">First Name</label>
            <input 
              type="text" 
              id="firstName" 
              name="firstName" 
              placeholder="Enter your first name" 
              required 
              autocomplete="given-name"
            >
          </div>
          <div class="form-group">
            <label for="lastName">Last Name</label>
            <input 
              type="text" 
              id="lastName" 
              name="lastName" 
              placeholder="Enter your last name" 
              required 
              autocomplete="family-name"
            >
          </div>
        </div>
        
        <div class="form-group">
          <label for="email">Email Address</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="Enter your email" 
            required 
            autocomplete="email"
          >
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label for="username">Username</label>
            <input 
              type="text" 
              id="username" 
              name="username" 
              placeholder="Enter your username" 
              required 
              autocomplete="username"
            >
          </div>
          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input 
              type="tel" 
              id="phone" 
              name="phone" 
              placeholder="Enter your phone number"
              autocomplete="tel"
            >
          </div>
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="Enter your password" 
            required 
            autocomplete="new-password"
          >
        </div>
        
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input 
            type="password" 
            id="confirmPassword" 
            name="confirmPassword" 
            placeholder="Confirm your password" 
            required 
            autocomplete="new-password"
          >
        </div>
        
        <div class="form-actions">
          <a href="../../home.html" class="btn-home" role="button">Back to Home</a>
          <button type="submit" class="btn-submit">Register</button>
        </div>
        
        <div class="links">
          Already have an account? <a href="login.html" aria-label="Sign in to existing account">Login</a>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
